# SecureBank DevSecOps pipeline (Java 17 + Maven + SonarQube + OWASP ZAP)
#
# In VS Code, save this file as:
#   .github/workflows/securebank-devsecops.yml
#
# Repository requirements:
#   1. pom.xml and Dockerfile at the repository root.
#   2. Secret:   SONAR_TOKEN
#   3. Variable: SONAR_HOST_URL   (for example, https://sonarqube.example.edu)
#   4. Variable: STAGING_URL      (an authorised HTTPS staging target)
#   5. Variable: DEPLOYMENT_MODE  (simulation or live; simulation is the default)
#   6. GitHub environments named staging and production. Add required reviewers
#      to production to create a manual approval gate.
#
# For a live deployment, also provide executable scripts:
#   scripts/deploy-staging.sh
#   scripts/deploy-production.sh
#
# Security note: major action tags are readable for assessment use. In a real
# banking repository, pin every action to a reviewed full commit SHA and use an
# automated dependency updater to keep those pins current.

name: SecureBank DevSecOps CI-CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      zap_scan_mode:
        description: "ZAP scan mode: baseline is passive; full is an active attack"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - full
      active_scan_authorisation:
        description: "For a full scan, type I_HAVE_AUTHORISATION"
        required: false
        type: string

# Apply least privilege to the automatically generated GITHUB_TOKEN.
permissions:
  contents: read

# Cancel an older run for the same branch when newer code is pushed.
concurrency:
  group: securebank-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  MAVEN_CLI_ARGS: "--batch-mode --no-transfer-progress"

jobs:
  # --------------------------------------------------------------------------
  # Gate 1: compile, unit tests and integration tests.
  # Maven Surefire normally runs unit tests; Failsafe runs integration tests
  # during `mvn verify` when it is configured in pom.xml.
  # --------------------------------------------------------------------------
  build-and-test:
    name: Build, unit test and integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Maven project structure
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f pom.xml ]]; then
            echo "::error title=Missing pom.xml::No pom.xml was found at the repository root. Open the correct project folder in VS Code, or add a job-level working-directory if the Java project is in a subfolder."
            exit 1
          fi

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: Compile and run all configured tests
        shell: bash
        run: mvn $MAVEN_CLI_ARGS clean verify

      - name: Verify unit and integration test reports
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          unit_report="$(find . \
            -type f \
            -path '*/target/surefire-reports/TEST-*.xml' \
            -print -quit)"

          integration_report="$(find . \
            -type f \
            -path '*/target/failsafe-reports/TEST-*.xml' \
            -print -quit)"

          if [[ -z "$unit_report" ]]; then
            echo "::error::No Surefire unit-test report was generated."
            echo "::error::Add a test file ending with Test.java under src/test/java."
            exit 1
          fi

          if [[ -z "$integration_report" ]]; then
            echo "::error::No Failsafe integration-test report was generated."
            echo "::error::Add a test file ending with IT.java under src/test/java."
            exit 1
          fi

          echo "Unit-test report: $unit_report"
          echo "Integration-test report: $integration_report"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-reports-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload packaged application
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: securebank-jar-${{ github.sha }}
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # Gate 2: SonarQube SAST. The scanner waits for the server-side Quality Gate;
  # a failed Quality Gate returns a non-zero status and stops later jobs.
  # Secrets are deliberately unavailable to untrusted fork pull requests.
  # --------------------------------------------------------------------------
  sast:
    name: SonarQube SAST and Quality Gate
    needs: build-and-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Check out source with full history for analysis
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SAST configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -f pom.xml ]] || { echo "::error::pom.xml must be at the repository root."; exit 1; }
          [[ -n "${SONAR_TOKEN:-}" ]] || { echo "::error::Add SONAR_TOKEN under Settings > Secrets and variables > Actions."; exit 1; }
          [[ -n "${SONAR_HOST_URL:-}" ]] || { echo "::error::Add SONAR_HOST_URL as a repository variable."; exit 1; }

      - name: Set up Java and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: Run SAST and enforce the SonarQube Quality Gate
        shell: bash
        run: |
          mvn $MAVEN_CLI_ARGS verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # --------------------------------------------------------------------------
  # Gate 3: create an immutable container artefact for the tested commit.
  # No registry credentials are required for this assessment-friendly example.
  # --------------------------------------------------------------------------
  package-container:
    name: Build and checksum container image
    needs: sast
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          [[ -f Dockerfile ]] || { echo "::error::Add a Dockerfile at the repository root."; exit 1; }

      - name: Build image for this exact commit
        shell: bash
        run: docker build --pull --tag "securebank:${GITHUB_SHA}" .

      - name: Export image and create integrity checksum
        shell: bash
        run: |
          set -euo pipefail
          docker save "securebank:${GITHUB_SHA}" | gzip > securebank-image.tar.gz
          sha256sum securebank-image.tar.gz > securebank-image.tar.gz.sha256

      - name: Upload container evidence
        uses: actions/upload-artifact@v7
        with:
          name: securebank-container-${{ github.sha }}
          path: |
            securebank-image.tar.gz
            securebank-image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # Gate 4: deploy to staging. Simulation mode is honest and safe for coursework.
  # Live mode fails closed unless an explicit deployment script is present.
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: package-container
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run staging deployment or documented simulation
        shell: bash
        run: |
          set -euo pipefail
          mode="${DEPLOYMENT_MODE:-simulation}"
          if [[ "$mode" == "live" ]]; then
            [[ -x scripts/deploy-staging.sh ]] || {
              echo "::error::Live mode requires executable scripts/deploy-staging.sh."
              exit 1
            }
            scripts/deploy-staging.sh "${GITHUB_SHA}"
          else
            echo "Academic simulation: commit ${GITHUB_SHA} passed the staging deployment gate."
            echo "No real environment was changed because DEPLOYMENT_MODE is not live."
          fi

  # --------------------------------------------------------------------------
  # Gate 5: OWASP ZAP DAST against an authorised staging URL only.
  # Baseline is passive. Full mode actively attacks the target and therefore
  # requires manual dispatch plus an exact authorisation phrase.
  # The final step fails the pipeline if any High-risk ZAP alert is reported.
  # --------------------------------------------------------------------------
  dast:
    name: OWASP ZAP DAST security gate
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build SecureBank image for DAST
        run: |
          docker build -t securebank:dast .

      - name: Create DAST Docker network
        run: |
          docker network create securebank-dast

      - name: Start SecureBank staging container
        run: |
          docker run -d \
            --name securebank-staging \
            --network securebank-dast \
            securebank:dast

      - name: Wait for SecureBank application
        run: |
          sleep 15
          docker ps
          docker logs securebank-staging

      - name: Create ZAP report directory
        shell: bash
      
        run: |
          set -euo pipefail
          install -d -o 1000 -g 1000 -m 700 zap-reports
          

      - name: Run OWASP ZAP baseline scan
        shell: bash
        run: |
          docker run --rm --network securebank-dast -v "$GITHUB_WORKSPACE/zap-reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://securebank-staging:8080 -r zap-baseline.html -J zap-baseline.json -w zap-baseline.md -I

            
            


      - name: Restore ZAP report ownership
        if : always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" zap-reports
          chmod -R u=rwX,go= zap-reports

      



      - name: Enforce zero High-risk ZAP alerts
        run: |
          report="zap-reports/zap-baseline.json"

          if [[ ! -s "$report" ]]; then
            echo "::error::ZAP JSON report was not created."
            exit 1
          fi

          high_count="$(jq '[.site[]?.alerts[]? | select((.riskcode | tonumber) >= 3)] | length' "$report")"

          echo "High-risk ZAP alerts: $high_count"

          if (( high_count > 0 )); then
            echo "::error::$high_count High-risk ZAP alert(s) found."
            exit 1
          fi

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-dast-reports-${{ github.run_number }}
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 30






  # --------------------------------------------------------------------------
  # Gate 6: production. Configure required reviewers on the `production`
  # environment so GitHub pauses here for human approval after every prior gate.
  # --------------------------------------------------------------------------
  deploy-production:
    name: Protected production deployment
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOYMENT_MODE: ${{ vars.DEPLOYMENT_MODE }}

    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run production deployment or documented simulation
        shell: bash
        run: |
          set -euo pipefail
          mode="${DEPLOYMENT_MODE:-simulation}"
          if [[ "$mode" == "live" ]]; then
            [[ -x scripts/deploy-production.sh ]] || {
              echo "::error::Live mode requires executable scripts/deploy-production.sh."
              exit 1
            }
            scripts/deploy-production.sh "${GITHUB_SHA}"
          else
            echo "Academic simulation: production approval granted for ${GITHUB_SHA}."
            echo "No real production system was changed."
          fi

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo "## SecureBank production gate"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Actor: \`${GITHUB_ACTOR}\`"
            echo "- Mode: \`${DEPLOYMENT_MODE:-simulation}\`"
            echo "- Result: all build, test, SAST and DAST gates passed"
          } >> "$GITHUB_STEP_SUMMARY"
